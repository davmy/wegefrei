Description: |-
  Wegefrei helps you report illegally parked vehicles in Germany. Take a
  photo of the vehicle - the app works out where and when it was taken from
  the photo's location/EXIF data, lets you fill in the vehicle and violation
  details, and generates a pre-filled report email, with the photo attached,
  addressed to the local authority.

  Location lookups for the incident address use the public Nominatim/
  OpenStreetMap reverse-geocoding service.

